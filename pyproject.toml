[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling with constrained decoding for LLMs"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
llm-sdk = { path = "llm_sdk/llm_sdk", editable = true }

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
